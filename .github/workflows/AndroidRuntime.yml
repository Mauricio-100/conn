name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Run Scripts and Apply Patches
      run: |
        echo "🚀 Running shell scripts..."
        for f in *.sh; do
          if [ -f "$f" ]; then
            echo "Executing $f..."
            chmod +x "$f"
            ./"$f" || echo "⚠️ Warning: Script $f exited with non-zero status"
          fi
        done
        
        echo "🚀 Applying patch files..."
        for f in *.patch; do
          if [ -f "$f" ]; then
            echo "Applying patch $f..."
            if git apply --check "$f" 2>/dev/null; then
              git apply "$f"
              echo "✅ Patch $f applied successfully using git apply"
            else
              echo "⚠️ Git apply check failed for $f. Attempting a fallback manual patch..."
              patch -p0 < "$f" || echo "⚠️ Warning: Could not apply patch $f"
            fi
          fi
        done

    - name: Decode Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          echo "✅ Decoding debug.keystore.base64 from repository..."
          base64 --decode debug.keystore.base64 > debug.keystore
        else
          echo "⚠️ No debug.keystore.base64 file found! Generating a temporary development keystore as a fallback..."
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: |
         if [ -f gradlew ]; then
           chmod +x gradlew
           ./gradlew assembleDebug
         else
           echo "⚠️ gradlew wrapper not found, building with pre-installed system Gradle..."
           gradle assembleDebug
         fi

    - name: Prepare Artifact
      run: |
        mkdir -p build-output
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          cp app/build/outputs/apk/debug/app-debug.apk build-output/iddet-cmo-debug.apk
        else
          echo "⚠️ Debug APK not found at standard path! Searching for generated APKs..."
          find app/build/outputs/ -name "*.apk" -exec cp {} build-output/iddet-cmo-debug.apk \;
        fi

    - name: Upload IDDET-CMO APK
      uses: actions/upload-artifact@v4
      with:
        name: iddet-cmo-apk
        path: build-output/iddet-cmo-debug.apk