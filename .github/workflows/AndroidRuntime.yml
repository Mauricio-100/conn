name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Decode Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          echo "✅ Decoding debug.keystore.base64 from repository..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "⚠️ No debug.keystore.base64 file found! Generating development keystore..."
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Building with configured Gradle 8.11.1..."
          gradle assembleDebug --stacktrace
        fi

    - name: Prepare Clean Artifacts
      run: |
        mkdir -p build-output
        APK_FILE=$(find app/build/outputs/apk/debug -name "*debug.apk" | head -n 1)
        if [ -z "$APK_FILE" ]; then
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        fi

        if [ -f "$APK_FILE" ]; then
          echo "✅ Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/iddet-cmo-debug.apk
          
          # Create direct zip archive with high compression and integrity check
          cd build-output
          zip -9 -v iddet-cmo-debug.zip iddet-cmo-debug.apk
          sha256sum iddet-cmo-debug.apk iddet-cmo-debug.zip > SHA256SUMS.txt
          echo "Artifacts generated successfully:"
          ls -la
          cat SHA256SUMS.txt
          cd ..
        else
          echo "❌ Error: No APK file was found in app/build/outputs!"
          exit 1
        fi

    - name: Upload IDDET-CMO APK & ZIP
      uses: actions/upload-artifact@v4
      with:
        name: iddet-cmo-apk
        path: |
          build-output/iddet-cmo-debug.apk
          build-output/iddet-cmo-debug.zip
          build-output/SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
